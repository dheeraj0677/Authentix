name: Authentix CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smart-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Blockchain Dependencies
        run: |
          cd blockchain
          npm ci
      - name: Run Hardhat Smart Contract Tests
        run: |
          cd blockchain
          npx hardhat test

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webapp/backend/requirements.txt
      - name: Build & Check Backend
        run: |
          python -c "import tensorflow as tf; print('TensorFlow version:', tf.__version__)"
          python -c "import web3; print('Web3 version:', web3.__version__)"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install & Build React Frontend
        run: |
          cd webapp/frontend
          npm ci
          npm run build
