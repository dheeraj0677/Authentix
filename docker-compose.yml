version: '3.8'

services:
  # Hardhat / Local Ethereum Node
  ethereum-node:
    image: node:18-alpine
    working_dir: /app/blockchain
    volumes:
      - ./blockchain:/app/blockchain
    command: sh -c "npm install && npx hardhat node"
    ports:
      - "8545:8545"

  # IPFS Gateway Node
  ipfs-node:
    image: ipfs/kubo:latest
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    environment:
      - IPFS_PATH=/data/ipfs

  # Authentix FastAPI Backend Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RPC_URL=http://ethereum-node:8545
      - IPFS_HOST=ipfs-node
      - IPFS_PORT=5001
    depends_on:
      - ethereum-node
      - ipfs-node

  # Authentix React Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
